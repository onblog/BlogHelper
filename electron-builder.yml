appId: com.onblog.bartool
productName: 吧台
copyright: Copyright © 2026 onblog

directories:
  output: release
  buildResources: build

# Reuse the Electron shipped in node_modules instead of downloading it again.
electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - electron/**/*
  - package.json
  # Runtime dependencies are no longer optional: the capture overlay ships a
  # prebuilt native addon, so node_modules has to travel with the app.
  - node_modules/**/*
  - '!**/*.map'
  # fabric only needs these for server-side rendering; the editor runs in a window.
  - '!**/node_modules/canvas/**'
  - '!**/node_modules/jsdom/**'

# The addon and the overlay's renderer assets are loaded from disk, not from
# inside the archive: keep both unpacked.
asarUnpack:
  - '**/node_modules/node-screenshots*/**'
  - '**/node_modules/electron-screenshots/**'

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: false
  # Architecture is chosen on the command line (--arm64 / --x64) so the two
  # dmg files never fight over the same volume name.
  target:
    - target: dmg
  # Ad-hoc signing happens in the afterPack hook: electron-builder does not
  # accept `identity: "-"` and would silently skip signing.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Pure menu bar app: no dock icon, no main window.
    LSUIElement: true

afterPack: scripts/after-pack.cjs

dmg:
  title: 吧台
  artifactName: bar-tool-${version}-${arch}.${ext}
