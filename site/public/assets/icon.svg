<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Warm amber board, the panel's accent colour, so the blue critter pops. -->
    <linearGradient id="board" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFD79A" />
      <stop offset="0.55" stop-color="#FFB955" />
      <stop offset="1" stop-color="#F79A38" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- fur: sky blue, one gradient for head and ears so they fuse -->
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="300" y1="230" x2="740" y2="840">
      <stop offset="0" stop-color="#CDE9FF" />
      <stop offset="0.35" stop-color="#8CC8FF" />
      <stop offset="1" stop-color="#4E96E8" />
    </linearGradient>
    <linearGradient id="innerEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E8" />
      <stop offset="1" stop-color="#FFE0C4" />
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7" />
      <stop offset="1" stop-color="#FFF1DA" />
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <clipPath id="boardClip">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#board)" />

  <g clip-path="url(#boardClip)">
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)" />

    <!-- soft ground shadow so the head sits on the board -->
    <ellipse cx="512" cy="838" rx="250" ry="34" fill="#8A4B12" opacity="0.18" filter="url(#soft)" />

    <!-- ears: soft triangles, so the mascot reads as a cat at a glance -->
    <g fill="url(#fur)">
      <path d="M330 392 C296 316 268 250 288 214 C310 176 392 232 452 296 Z" />
      <path d="M694 392 C728 316 756 250 736 214 C714 176 632 232 572 296 Z" />
    </g>
    <g fill="url(#innerEar)">
      <path d="M348 372 C322 312 302 262 316 240 C334 214 392 258 430 306 Z" />
      <path d="M676 372 C702 312 722 262 708 240 C690 214 632 258 594 306 Z" />
    </g>

    <!-- head -->
    <circle cx="512" cy="556" r="258" fill="url(#fur)" />

    <!-- muzzle -->
    <ellipse cx="512" cy="632" rx="176" ry="128" fill="url(#muzzle)" />

    <!-- cheeks -->
    <ellipse cx="330" cy="640" rx="46" ry="28" fill="#FFC9A8" opacity="0.85" />
    <ellipse cx="694" cy="640" rx="46" ry="28" fill="#FFC9A8" opacity="0.85" />

    <!-- eyes -->
    <g>
      <ellipse cx="416" cy="556" rx="34" ry="42" fill="#3A2E23" />
      <ellipse cx="608" cy="556" rx="34" ry="42" fill="#3A2E23" />
      <circle cx="428" cy="540" r="13" fill="#FFFFFF" />
      <circle cx="620" cy="540" r="13" fill="#FFFFFF" />
      <circle cx="404" cy="572" r="6" fill="#FFFFFF" opacity="0.7" />
      <circle cx="596" cy="572" r="6" fill="#FFFFFF" opacity="0.7" />
    </g>

    <!-- nose -->
    <path
      d="M486 604 C486 594 500 588 512 596 C524 588 538 594 538 604 C538 615 522 626 512 626 C502 626 486 615 486 604 Z"
      fill="#FF8064"
    />

    <!-- whiskers: the one cat cue that survives down to 16px -->
    <g stroke="#3A2E23" stroke-opacity="0.72" stroke-width="9" stroke-linecap="round">
      <path d="M300 612 L196 596" />
      <path d="M296 648 L190 650" />
      <path d="M304 684 L204 708" />
      <path d="M724 612 L828 596" />
      <path d="M728 648 L834 650" />
      <path d="M720 684 L820 708" />
    </g>

    <!-- mouth: the small ω that makes it read friendly -->
    <path
      d="M512 626 C512 648 496 660 478 656 M512 626 C512 648 528 660 546 656"
      fill="none"
      stroke="#3A2E23"
      stroke-width="13"
      stroke-linecap="round"
    />
  </g>
</svg>
