<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6" />
      <stop offset="1" stop-color="#FFEBC9" />
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC4FF" />
      <stop offset="1" stop-color="#4A9DE8" />
    </linearGradient>
  </defs>

  <!-- sticker board -->
  <rect x="92" y="92" width="840" height="840" rx="196" fill="url(#bg)" />
  <rect
    x="92"
    y="92"
    width="840"
    height="840"
    rx="196"
    fill="none"
    stroke="#3A2E23"
    stroke-width="22"
  />

  <!-- ears -->
  <g stroke="#3A2E23" stroke-width="22" stroke-linejoin="round">
    <ellipse cx="262" cy="292" rx="112" ry="152" fill="url(#fur)" transform="rotate(-42 262 292)" />
    <ellipse cx="762" cy="292" rx="112" ry="152" fill="url(#fur)" transform="rotate(42 762 292)" />
  </g>
  <ellipse cx="262" cy="300" rx="58" ry="98" fill="#C9E8FF" transform="rotate(-42 262 300)" />
  <ellipse cx="762" cy="300" rx="58" ry="98" fill="#C9E8FF" transform="rotate(42 762 300)" />

  <!-- head -->
  <ellipse cx="512" cy="566" rx="300" ry="240" fill="url(#fur)" stroke="#3A2E23" stroke-width="22" />

  <!-- muzzle -->
  <ellipse cx="512" cy="632" rx="164" ry="126" fill="#D8EEFF" stroke="#3A2E23" stroke-width="18" />

  <!-- eyes -->
  <g>
    <ellipse cx="412" cy="516" rx="54" ry="64" fill="#2A2118" />
    <ellipse cx="612" cy="516" rx="54" ry="64" fill="#2A2118" />
    <circle cx="430" cy="494" r="19" fill="#FFFDF6" />
    <circle cx="630" cy="494" r="19" fill="#FFFDF6" />
  </g>

  <!-- nose + smile -->
  <path
    d="M486 588 Q512 570 538 588 Q538 606 512 614 Q486 606 486 588 Z"
    fill="#2A2118"
  />
  <path
    d="M458 636 Q512 690 566 636"
    fill="none"
    stroke="#2A2118"
    stroke-width="18"
    stroke-linecap="round"
  />
</svg>
