<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!--
    Menu bar template image, drawn on a 22-unit grid: 1 unit = 1pt at @1x, so
    rsvg-convert -w 22 / -w 44 lands on whole pixels for both densities.

    Monochrome on purpose: macOS recolours a template image from its alpha
    channel alone, so the artwork must stay pure #000 plus transparency and is
    never more than one ink colour. Eye pupils are kept as opaque dots inside
    the punched-out eyes, which is what turns them into the mascot's big eyes in
    a light menu bar (the dark bar inverts the ink, pupils included).

    Shape: the squared-off cat head from the app icon with tall ears, a wide
    notch, two big eyes and a raised tail. Content spans 18.2pt of the 22-unit
    canvas so the item keeps clear of the menu bar edges.
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M 6.75 16.70
    V 5.55 Q 6.75 5.00 6.80 4.45
    L 7.01 2.32 Q 7.05 1.90 7.35 2.19
    L 9.71 4.47 Q 10.11 4.85 10.66 4.85
    H 14.64 Q 15.19 4.85 15.59 4.47
    L 17.95 2.19 Q 18.25 1.90 18.29 2.32
    L 18.50 4.45 Q 18.55 5.00 18.55 5.55
    V 16.70
    A 3.40 3.40 0 0 1 15.15 20.10
    H 10.15 A 3.40 3.40 0 0 1 6.75 16.70 Z
    M 7.80 9.20 a 1.95 1.95 0 1 0 3.90 0 a 1.95 1.95 0 1 0 -3.90 0 Z
    M 13.60 9.20 a 1.95 1.95 0 1 0 3.90 0 a 1.95 1.95 0 1 0 -3.90 0 Z"/>
  <circle cx="9.75" cy="9.20" r="0.95"/>
  <circle cx="15.55" cy="9.20" r="0.95"/>
  <!-- Tail: one tapered outline (2.0pt where it leaves the body, 1.3pt at the
       round tip) instead of a uniform stroke, so the join at the chin stays
       solid and the tip does not read as a handle. -->
  <path fill="#000" d="
    M 8.88 17.71
    C 8.31 17.82 7.67 17.50 7.25 17.09
    C 6.42 16.30 5.92 15.20 5.53 14.13
    C 5.04 12.77 4.75 11.35 4.55 9.92
    A 0.65 0.65 0 0 1 3.25 10.08
    C 3.40 11.60 3.66 13.13 4.10 14.60
    C 4.50 15.92 5.06 17.26 5.97 18.30
    C 6.73 19.16 7.98 19.79 9.12 19.69
    Z"/>
</svg>
