<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>吧台 · bar-tool</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>

  <body>
    <div class="panel">
      <header class="topbar">
        <button class="icon-btn icon-btn--back" id="back" type="button" hidden>←</button>

        <div class="brand" id="brand">
          <img class="brand__glyph" src="./assets/glyph.svg" alt="" width="18" height="18" />
          <span class="brand__name" data-i18n="brand">吧台</span>
          <span class="brand__version" id="version"></span>
        </div>

        <span class="view-title" id="view-title" hidden></span>

        <div class="topbar__actions">
          <button
            class="icon-btn"
            id="lang-toggle"
            type="button"
            data-i18n-title="action.lang"
            title="Switch language"
          >
            EN
          </button>
          <button
            class="icon-btn"
            id="settings"
            type="button"
            data-i18n-title="action.settings"
            title="Settings"
          >
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path
                d="M6.6 1.6h2.8l.35 1.6 1.1.64 1.5-.65 1.4 2.42-1.2 1.1v1.28l1.2 1.1-1.4 2.42-1.5-.65-1.1.64-.35 1.6H6.6l-.35-1.6-1.1-.64-1.5.65-1.4-2.42 1.2-1.1V7.3L2.4 6.2l1.4-2.42 1.5.65 1.1-.64z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.1"
                stroke-linejoin="round"
              />
              <circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.1" />
            </svg>
          </button>
        </div>
      </header>

      <!-- main view ------------------------------------------------------- -->
      <div class="view" id="view-main">
        <section class="block">
          <div class="block__head">
            <h2 class="block__title" data-i18n="clip.title">剪贴板</h2>
            <span class="chip" id="clip-meta"></span>
          </div>
          <div class="preview" id="preview"></div>
        </section>

        <section class="block block--grow">
          <div class="block__head">
            <h2 class="block__title" data-i18n="actions.title">能做什么</h2>
            <span class="chip" id="action-count"></span>
          </div>
          <div class="actions" id="actions"></div>
        </section>

        <section class="history-strip">
          <span class="history-strip__label" data-i18n="history.strip">最近</span>
          <div class="history-strip__chips" id="history-chips"></div>
          <button class="link" id="history-all" type="button" data-i18n="history.all">全部</button>
        </section>
      </div>

      <!-- history view ---------------------------------------------------- -->
      <div class="view" id="view-history" hidden>
        <div class="view-head">
          <span class="chip" id="history-stats"></span>
          <button class="link link--danger" id="history-clear" type="button"></button>
        </div>
        <ul class="hlist" id="hlist"></ul>
      </div>

      <!-- settings view --------------------------------------------------- -->
      <div class="view" id="view-settings" hidden>
        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.history">记录剪贴板历史</span>
            <span class="setting__hint" data-i18n="settings.historyHint">关掉后不再记录新内容</span>
          </div>
          <button
            class="switch"
            id="set-history"
            type="button"
            role="switch"
            aria-checked="true"
          ></button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.maxItems">最多保留</span>
            <span class="setting__hint" id="settings-usage"></span>
          </div>
          <select class="select" id="set-max">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.launch">开机启动</span>
            <span class="setting__hint" data-i18n="settings.launchHint">登录后自动常驻菜单栏</span>
          </div>
          <button
            class="switch"
            id="set-launch"
            type="button"
            role="switch"
            aria-checked="false"
          ></button>
        </div>

        <div class="about">
          <button class="link" id="about-github" type="button" data-i18n="settings.github">
            GitHub 仓库
          </button>
          <button class="link" id="about-docs" type="button" data-i18n="settings.docs">
            使用文档
          </button>
          <span class="chip" id="about-version"></span>
        </div>
      </div>

      <footer class="foot" id="foot">
        <span class="dot" id="dot" data-state="idle"></span>
        <span class="foot__text" id="status"></span>
        <button class="link" id="undo" type="button" hidden></button>
        <span class="foot__hint" id="hint"></span>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
