<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>喵喵吧台 · Miaomiao Bar</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>

  <body>
    <div class="panel">
      <header class="topbar">
        <button class="icon-btn icon-btn--back" id="back" type="button" hidden>←</button>

        <div class="brand" id="brand">
          <!-- the app icon itself, simplified for 20px: cat ears, cream muzzle -->
          <svg class="brand__glyph" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
            <rect x="0.5" y="0.5" width="19" height="19" rx="5" fill="#FFB955" />
            <path d="M6.6 7.6C5.4 6.2 4.6 4.7 4.9 4.1c.4-.7 2.1.2 3.4 1.4z" fill="#8CC8FF" />
            <path d="M13.4 7.6c1.2-1.4 2-2.9 1.7-3.5-.4-.7-2.1.2-3.4 1.4z" fill="#8CC8FF" />
            <path d="M5.9 6.2c.2-.5.9-.3 1.5.2z" fill="#FFF7E8" />
            <path d="M14.1 6.2c-.2-.5-.9-.3-1.5.2z" fill="#FFF7E8" />
            <circle cx="10" cy="11.6" r="5.5" fill="#8CC8FF" />
            <ellipse cx="10" cy="13.2" rx="3.3" ry="2.4" fill="#FFF7E8" />
            <circle cx="8.2" cy="11.1" r="0.95" fill="#3A2E23" />
            <circle cx="11.8" cy="11.1" r="0.95" fill="#3A2E23" />
            <ellipse cx="10" cy="12.6" rx="0.8" ry="0.65" fill="#FF8064" />
          </svg>
          <span class="brand__name" data-i18n="brand">喵喵吧台</span>
          <span class="brand__version" id="version"></span>
        </div>

        <span class="view-title" id="view-title" hidden></span>

        <div class="topbar__actions">
          <button
            class="icon-btn"
            id="lang-toggle"
            type="button"
            data-i18n-title="action.lang"
            title="Switch language"
          >
            EN
          </button>

          <button
            class="icon-btn"
            id="theme-toggle"
            type="button"
            data-i18n-title="action.theme"
            title="Appearance"
          >
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.2" />
              <path d="M8 2.8a5.2 5.2 0 0 0 0 10.4z" fill="currentColor" />
            </svg>
          </button>

          <button
            class="icon-btn"
            id="settings"
            type="button"
            data-i18n-title="action.settings"
            title="Settings"
          >
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path
                d="M6.6 1.6h2.8l.35 1.6 1.1.64 1.5-.65 1.4 2.42-1.2 1.1v1.28l1.2 1.1-1.4 2.42-1.5-.65-1.1.64-.35 1.6H6.6l-.35-1.6-1.1-.64-1.5.65-1.4-2.42 1.2-1.1V7.3L2.4 6.2l1.4-2.42 1.5.65 1.1-.64z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.1"
                stroke-linejoin="round"
              />
              <circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.1" />
            </svg>
          </button>

          <button
            class="icon-btn"
            id="quit"
            type="button"
            data-i18n-title="action.quit"
            title="Quit"
          >
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <path d="M8 2.4v5" />
              <path d="M4.5 4.4a4.6 4.6 0 1 0 7 0" />
            </svg>
          </button>
        </div>
      </header>

      <!-- main view ------------------------------------------------------- -->
      <div class="view" id="view-main" tabindex="-1">
        <section class="block">
          <div class="block__head">
            <h2 class="block__title" data-i18n="clip.title">剪贴板</h2>
            <div class="block__head-actions">
              <span class="chip" id="clip-meta"></span>
              <button class="link" id="edit-save" type="button" data-i18n="edit.save" hidden>
                保存
              </button>
              <button class="link" id="edit-cancel" type="button" data-i18n="edit.cancel" hidden>
                取消
              </button>
            </div>
          </div>
          <div class="preview" id="preview"></div>
        </section>

        <section class="block block--grow">
          <div class="block__head">
            <h2 class="block__title" data-i18n="actions.title">能做什么</h2>
            <div class="block__head-actions">
              <span class="chip" id="action-count"></span>
              <button
                class="undo-btn"
                id="undo-inline"
                type="button"
                data-i18n-title="action.undo"
                title="Undo ⌥⌘Z"
                hidden
              >
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 4.2L2.8 7.4 6 10.6" />
                  <path d="M2.8 7.4h6.4a3.4 3.4 0 0 1 0 6.8H7.6" />
                </svg>
              </button>
            </div>
          </div>
          <div class="actions" id="actions"></div>
        </section>

        <section class="history-strip">
          <span class="history-strip__label" data-i18n="history.strip">最近</span>
          <div class="history-strip__chips" id="history-chips"></div>
          <button class="link" id="history-all" type="button" data-i18n="history.all">全部</button>
        </section>
      </div>

      <!-- history view ---------------------------------------------------- -->
      <div class="view" id="view-history" hidden>
        <div class="view-head">
          <span class="chip" id="history-stats"></span>
          <button class="link link--danger" id="history-clear" type="button"></button>
        </div>
        <ul class="hlist" id="hlist"></ul>
      </div>

      <!-- settings view --------------------------------------------------- -->
      <div class="view" id="view-settings" hidden>
        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.history">记录剪贴板历史</span>
            <span class="setting__hint" data-i18n="settings.historyHint">关掉后不再记录新内容</span>
          </div>
          <button
            class="switch"
            id="set-history"
            type="button"
            role="switch"
            aria-checked="true"
          ></button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.maxItems">最多保留</span>
            <span class="setting__hint" id="settings-usage"></span>
          </div>
          <select class="select" id="set-max">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.launch">开机启动</span>
            <span class="setting__hint" data-i18n="settings.launchHint">登录后自动常驻菜单栏</span>
          </div>
          <button
            class="switch"
            id="set-launch"
            type="button"
            role="switch"
            aria-checked="false"
          ></button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.update">检查更新</span>
            <span class="setting__hint" id="update-hint" data-i18n="settings.updateHint">
              每天自动检查一次，也可以现在就看
            </span>
          </div>
          <button class="link" id="check-update" type="button" data-i18n="settings.updateAction">
            立即检查
          </button>
        </div>

        <div class="section">
          <div class="section__title" data-i18n="settings.storage">存储</div>
          <ul class="buckets" id="bucket-list"></ul>
          <button class="link" id="bucket-add" type="button" data-i18n="settings.addBucket">
            添加存储桶
          </button>
        </div>

        <div class="setting">
          <div class="setting__text">
            <span class="setting__label" data-i18n="settings.linkFormat">复制格式</span>
            <span class="setting__hint" data-i18n="settings.linkFormatHint">
              上传后写回剪贴板的格式
            </span>
          </div>
          <select class="select" id="set-format">
            <option value="url">URL</option>
            <option value="markdown">Markdown</option>
            <option value="html">HTML</option>
            <option value="bbcode">BBCode</option>
          </select>
        </div>

        <div class="about">
          <button class="about__item about__item--link" id="about-author" type="button" title="github.com/onblog">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="5.4" r="2.7" />
              <path d="M2.9 13.4c.6-2.4 2.7-3.8 5.1-3.8s4.5 1.4 5.1 3.8" />
            </svg>
            Martin
          </button>
          <span class="about__item">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.8" y="3.6" width="12.4" height="8.8" rx="1.8" />
              <path d="M2.4 4.6L8 8.6l5.6-4" />
            </svg>
            hello@wordtk.com
          </span>
          <button class="link" id="about-github" type="button" data-i18n="settings.github">
            GitHub 仓库
          </button>
          <button class="link" id="about-docs" type="button" data-i18n="settings.docs">
            使用文档
          </button>
          <span class="chip" id="about-version"></span>
        </div>

        <button class="donate" id="donate" type="button">
          <span class="donate__icon">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6.5h8.5v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" />
              <path d="M11.5 8h1.2a1.6 1.6 0 0 1 0 3.2h-1.2" />
              <path d="M5.4 4.4c.5-.6.5-1.2 0-1.8M8 4.4c.5-.6.5-1.2 0-1.8" />
            </svg>
          </span>
          <span class="donate__text">
            <b data-i18n="donate.title">请我喝杯咖啡</b>
            <span data-i18n="donate.sub">你的支持让喵喵吧台继续更新</span>
          </span>
          <span class="donate__chev">→</span>
        </button>

      </div>

      <!-- bucket form ------------------------------------------------------ -->
      <div class="view" id="view-bucket" hidden>
        <div class="form">
          <label class="form__row">
            <span class="form__label" data-i18n="bucket.name">名称</span>
            <input class="input" id="b-name" type="text" autocomplete="off" />
          </label>
          <label class="form__row">
            <span class="form__label" data-i18n="bucket.endpoint">Endpoint</span>
            <input class="input" id="b-endpoint" type="text" placeholder="https://acc.r2.cloudflarestorage.com" autocomplete="off" />
          </label>
          <label class="form__row">
            <span class="form__label" data-i18n="bucket.region">Region</span>
            <input class="input" id="b-region" type="text" placeholder="auto" autocomplete="off" />
          </label>
          <label class="form__row">
            <span class="form__label" data-i18n="bucket.bucket">桶名</span>
            <input class="input" id="b-bucket" type="text" autocomplete="off" />
          </label>
          <label class="form__row">
            <span class="form__label" data-i18n="bucket.publicBase">公开域名</span>
            <input class="input" id="b-public" type="text" placeholder="https://img.example.com" autocomplete="off" />
          </label>
          <label class="form__row">
            <span class="form__label">Access Key</span>
            <input class="input" id="b-access" type="text" autocomplete="off" spellcheck="false" />
          </label>
          <label class="form__row">
            <span class="form__label">Secret Key</span>
            <input class="input" id="b-secret" type="password" autocomplete="new-password" spellcheck="false" />
            <span class="form__hint" data-i18n="bucket.secretHint">留空则保留已保存的密钥</span>
          </label>

          <div class="setting setting--flush">
            <div class="setting__text">
              <span class="setting__label" data-i18n="bucket.pathStyle">路径风格寻址</span>
              <span class="setting__hint" data-i18n="bucket.pathStyleHint">
                endpoint/桶名/文件名，MinIO 与自建常用
              </span>
            </div>
            <button class="switch" id="b-path" type="button" role="switch" aria-checked="true"></button>
          </div>
        </div>

        <div class="form__actions">
          <button class="btn-primary" id="b-save" type="button" data-i18n="bucket.save">保存</button>
          <button class="link link--danger" id="b-delete" type="button" data-i18n="bucket.delete">
            删除
          </button>
        </div>
      </div>

      <footer class="foot" id="foot">
        <span class="dot" id="dot" data-state="idle"></span>
        <span class="foot__text" id="status"></span>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
