<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>吧台 · bar-tool</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>

  <body>
    <div class="panel">
      <header class="topbar">
        <div class="brand">
          <img class="brand__glyph" src="./assets/glyph.svg" alt="" width="18" height="18" />
          <span class="brand__name" data-i18n="brand">吧台</span>
          <span class="brand__version" id="version"></span>
        </div>

        <div class="topbar__actions">
          <button class="icon-btn" id="lang-toggle" type="button" data-i18n-title="action.lang" title="Switch language">
            EN
          </button>
          <button class="icon-btn" id="settings" type="button" data-i18n-title="action.settings" title="Settings">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path
                d="M6.6 1.6h2.8l.35 1.6 1.1.64 1.5-.65 1.4 2.42-1.2 1.1v1.28l1.2 1.1-1.4 2.42-1.5-.65-1.1.64-.35 1.6H6.6l-.35-1.6-1.1-.64-1.5.65-1.4-2.42 1.2-1.1V7.3L2.4 6.2l1.4-2.42 1.5.65 1.1-.64z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.1"
                stroke-linejoin="round"
              />
              <circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.1" />
            </svg>
          </button>
        </div>
      </header>

      <section class="block">
        <div class="block__head">
          <h2 class="block__title" data-i18n="clip.title">剪贴板</h2>
          <span class="chip" id="clip-meta"></span>
        </div>
        <div class="preview" id="preview"></div>
      </section>

      <section class="block block--form">
        <div class="field">
          <span class="field__label" data-i18n="bucket.label">存入</span>
          <select class="select" id="bucket">
            <option value="" data-i18n="bucket.empty">未配置存储桶</option>
          </select>
          <button class="link" id="manage" type="button" data-i18n="bucket.manage">管理</button>
        </div>

        <div class="segmented" id="format" role="group" data-i18n-title="format.label" title="复制格式">
          <button class="seg is-active" type="button" data-format="url">URL</button>
          <button class="seg" type="button" data-format="markdown">Markdown</button>
          <button class="seg" type="button" data-format="html">HTML</button>
          <button class="seg" type="button" data-format="bbcode">BBCode</button>
        </div>

        <button class="primary" id="upload" type="button" disabled>
          <span data-i18n="upload.label">上传并复制</span>
          <kbd>⌥⌘U</kbd>
        </button>
      </section>

      <section class="block block--grow">
        <div class="block__head">
          <h2 class="block__title" data-i18n="recent.title">最近上传</h2>
          <button class="link" id="recent-all" type="button" disabled data-i18n="recent.all">查看全部</button>
        </div>
        <ul class="recent" id="recent"></ul>
      </section>

      <footer class="foot">
        <span class="dot" id="dot" data-state="idle"></span>
        <span class="foot__text" id="status" data-i18n="status.noBucket">未配置存储桶</span>
        <span class="foot__hint">⌥⌘V</span>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
